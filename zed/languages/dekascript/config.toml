name = "dekascript"
grammar = "deka"
path_suffixes = ["ds", "dsx"]
line_comments = ["//"]
block_comment = ["/*", "*/"]
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
]
