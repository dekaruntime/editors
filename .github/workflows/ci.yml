name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags-ignore: ['v*']

jobs:
  vscode:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install, typecheck, and test
        working-directory: vscode
        run: |
          npm ci
          npm run compile
          npm test
      - name: Package VSIX
        working-directory: vscode
        run: npx @vscode/vsce package --out deka.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: deka-vsix
          path: vscode/deka.vsix

  zed:
    runs-on: [self-hosted, macOS, ARM64]
    environment: public-ci
    env:
      CARGO_INCREMENTAL: 0
      SCCACHE_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      SCCACHE_REGION: "auto"
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      # The bugsy runner has no rustup on PATH; this action bootstraps it and
      # installs the pinned toolchain plus the wasm target in one step, so no
      # separate `rustup target add` is needed.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-wasip1
      # Two-mode, a deliberate deviation from dekaruntime/deka's loud failure:
      # the R2 secrets are staff-only and not provisioned in this repo (the
      # auto-created public-ci environment is empty), so missing credentials
      # downgrade to sccache's local disk cache instead of failing the build.
      # With all three vars present, behavior matches deka: an arch-derived
      # shared bucket.
      - name: Configure sccache bucket
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ] && [ -n "$SCCACHE_ENDPOINT" ]; then
            # Bucket is architecture-specific; derive it from the host rather than
            # restating it per job (mirrors dekaruntime/deka's ci.yml, deka#655).
            case "$(uname -s)-$(uname -m)" in
              Darwin-arm64)  BUCKET=deka-sccache-darwin-arm64 ;;
              Darwin-x86_64) BUCKET=deka-sccache-darwin-x64 ;;
              Linux-x86_64)  BUCKET=deka-sccache-linux-x64 ;;
              *) echo "unsupported sccache host: $(uname -sm)" >&2; exit 1 ;;
            esac
            echo "SCCACHE_BUCKET=$BUCKET" >> "$GITHUB_ENV"
            echo "sccache bucket: $BUCKET"
          else
            echo "::warning::R2 sccache credentials are not configured in this repository yet; sccache will use its local disk cache. Add R2_ENDPOINT / R2_SCCACHE_ACCESS_KEY_ID / R2_SCCACHE_SECRET_ACCESS_KEY to the public-ci environment to enable the shared bucket (same names as dekaruntime/deka)."
          fi
      # The action installs the binary. It runs after the bucket step so it
      # receives the complete R2 cache configuration.
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Enable sccache compiler wrapper
        run: |
          # The rust-toolchain action reinstalls rustup, which wipes
          # cargo-installed binaries out of ~/.cargo/bin - sccache included.
          # Setting RUSTC_WRAPPER to a binary that is not there makes every
          # cargo invocation die with ENOENT before it compiles anything,
          # which reads as a code failure and is not one. Only enable the
          # wrapper if the binary actually exists, and fail loudly when it
          # does not: a cold build hides a broken runner, and sccache is
          # required.
          if command -v sccache >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "sccache enabled${SCCACHE_BUCKET:+, bucket: $SCCACHE_BUCKET}"
          else
            echo "::error::sccache is not on PATH. SCCACHE IS REQUIRED FOR ALL RUST COMPILATION."
            exit 1
          fi
      - name: Build extension wasm
        working-directory: zed
        run: cargo build --release --target wasm32-wasip1 --locked
      - uses: actions/upload-artifact@v4
        with:
          name: deka-zed-wasm
          path: zed/target/wasm32-wasip1/release/deka_zed.wasm

  nvim:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        run: |
          brew install neovim
      - name: Lua syntax check
        working-directory: nvim
        run: |
          nvim --headless -u NONE -l tests/test_discovery.lua
      - name: Managed-download regression test (E5560 fast-event crash)
        working-directory: nvim
        run: |
          nvim --headless -u NONE -l tests/test_managed_download.lua
      - name: Check dsc version pins
        run: |
          sh scripts/check-dsc-version.sh
      - name: Headless plugin smoke test (attaches dsc lsp from PATH)
        working-directory: nvim
        env:
          DEKA_SMOKE_SAMPLE: ${{ runner.temp }}/deka-smoke/sample.ds
          DEKA_SMOKE_OUT: ${{ runner.temp }}/deka-smoke/out.log
        run: |
          mkdir -p "$(dirname "$DEKA_SMOKE_SAMPLE")"
          printf 'export fn main(): string {\n  return "hi"\n}\n' > "$DEKA_SMOKE_SAMPLE"
          # dsc is already on the self-hosted runner PATH; smoke.lua exits 1
          # unless the deka client attaches.
          nvim --headless -u NONE --cmd "set rtp+=." \
            -c "runtime plugin/deka.lua" \
            -c "luafile scripts/smoke.lua"
          cat "$DEKA_SMOKE_OUT"
