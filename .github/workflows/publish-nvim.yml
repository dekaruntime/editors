name: publish-nvim

# Publishes the Neovim plugin to luarocks.org as the `deka` rock on v* tags.
#
# Secret Ava must add:
#   LUAROCKS_API_KEY — API key from luarocks.org (Settings -> API keys)

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: [self-hosted, macOS, ARM64]
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaRocks
        run: brew install luarocks
      - name: Set rock version from tag
        working-directory: nvim
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -e "s/version = 'scm-1'/version = '$VERSION-1'/" \
              -e "s|url = 'git+https://github.com/dekaruntime/editors.git',|url = 'git+https://github.com/dekaruntime/editors.git',\\n  tag = '$GITHUB_REF_NAME',|" \
            deka-scm-1.rockspec > "deka-$VERSION-1.rockspec"
          grep -q "tag = '$GITHUB_REF_NAME'" "deka-$VERSION-1.rockspec" || { echo "::error::versioned rockspec is missing its source tag"; exit 1; }
      - name: Test
        working-directory: nvim
        run: |
          brew install neovim
          nvim --headless -u NONE -l tests/test_discovery.lua
      - name: Upload rock to luarocks.org
        working-directory: nvim
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          luarocks upload --api-key="$LUAROCKS_API_KEY" "deka-$VERSION-1.rockspec"
