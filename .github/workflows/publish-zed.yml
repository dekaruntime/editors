# SCCACHE IS REQUIRED FOR ALL RUST COMPILATION.
# EVERY CARGO BUILD/TEST/CHECK MUST RUN WITH RUSTC_WRAPPER=sccache. NO EXCEPTIONS.

name: publish-zed

# Prepares the DekaScript Zed extension for the Zed extension registry.
#
# Zed's registry is the zed-industries/extensions repo: publishing means a PR
# adding dekaruntime/editors as an extension entry there. That upstream PR must
# come from a maintainer with push access, and there is intentionally NO
# ZED_EXTENSIONS_TOKEN in this repo — staff confirmed Zed publishing is done
# by hand via a fork. So this workflow only validates the extension, builds
# the wasm, and prints the exact manual upstreaming steps on every v* tag.

on:
  push:
    tags: ['v*']

jobs:
  prepare:
    runs-on: [self-hosted, macOS, ARM64]
    environment: release
    env:
      CARGO_INCREMENTAL: 0
      SCCACHE_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      SCCACHE_REGION: "auto"
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      # The bugsy runner has no rustup on PATH; this action bootstraps it and
      # installs the pinned toolchain plus the wasm target in one step.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-wasip1
      # R2 cache credentials come from the job's environment (public-ci or release).
      # Missing credentials fail the job, as in dekaruntime/deka: a cold build hides a broken setup.
      - name: Configure sccache bucket
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ] && [ -n "$SCCACHE_ENDPOINT" ]; then
            # One shared bucket, `tooling`, scoped to this org's tooling repos; the token
            # can reach nothing else. Architectures are separated by key prefix.
            case "$(uname -s)-$(uname -m)" in
              Darwin-arm64)  PREFIX=editors/darwin-arm64 ;;
              Darwin-x86_64) PREFIX=editors/darwin-x64 ;;
              Linux-x86_64)  PREFIX=editors/linux-x64 ;;
              *) echo "unsupported sccache host: $(uname -sm)" >&2; exit 1 ;;
            esac
            echo "SCCACHE_BUCKET=tooling" >> "$GITHUB_ENV"
            echo "SCCACHE_S3_KEY_PREFIX=$PREFIX" >> "$GITHUB_ENV"
            echo "sccache bucket: tooling/$PREFIX"
          else
            echo "::error::R2 sccache credentials are missing. SCCACHE IS REQUIRED FOR ALL RUST COMPILATION."
            exit 1
          fi
      # The action installs the binary. It runs after the bucket step so it
      # receives the complete R2 cache configuration.
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Enable sccache compiler wrapper
        run: |
          # The rust-toolchain action reinstalls rustup, which wipes
          # cargo-installed binaries out of ~/.cargo/bin - sccache included.
          # Setting RUSTC_WRAPPER to a binary that is not there makes every
          # cargo invocation die with ENOENT before it compiles anything,
          # which reads as a code failure and is not one. Only enable the
          # wrapper if the binary actually exists, and fail loudly when it
          # does not: a cold build hides a broken runner, and sccache is
          # required.
          if command -v sccache >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "sccache enabled${SCCACHE_BUCKET:+, bucket: $SCCACHE_BUCKET}"
          else
            echo "::error::sccache is not on PATH. SCCACHE IS REQUIRED FOR ALL RUST COMPILATION."
            exit 1
          fi
      - name: Build extension wasm
        working-directory: zed
        run: cargo build --release --target wasm32-wasip1 --locked
      - name: Validate extension manifest
        run: |
          test -f zed/extension.toml
          grep -q '^\[grammars.deka\]' zed/extension.toml
          grep -q '^\[language_servers.deka\]' zed/extension.toml
      - name: Print manual upstreaming instructions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          echo "Zed extension v${VERSION} built and validated."
          echo ""
          echo "Zed publishing is manual — there is no ZED_EXTENSIONS_TOKEN in this repo."
          echo "Upstream it with a PR against zed-industries/extensions:"
          echo ""
          echo "  1. Fork https://github.com/zed-industries/extensions and clone your fork."
          echo "  2. Add dekaruntime/editors as a submodule at tag ${TAG}:"
          echo "       git submodule add https://github.com/dekaruntime/editors extensions/deka"
          echo "       cd extensions/deka && git checkout ${TAG} && cd ../.."
          echo "  3. Bump the version to ${VERSION} in extensions.toml:"
          echo "       [deka]"
          echo "       submodule = \"extensions/deka\""
          echo "       version = \"${VERSION}\""
          echo "  4. Open a PR to zed-industries/extensions titled:"
          echo "       \"Add DekaScript extension v${VERSION}\""
          echo "  5. Docs: https://zed.dev/docs/extensions/developing-extensions"
